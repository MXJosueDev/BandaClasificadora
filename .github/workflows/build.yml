name: Build Executables

on:
  push:
    branches: [ main ]
    tags:
      - 'v*' 
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows-executable
            original_file: main.exe 
            os_suffix: windows
            ext: .exe
          - os: macos-latest
            artifact_name: macos-executable
            original_file: main
            os_suffix: macos
            ext: ""

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'pyproject.toml'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Build with PyInstaller
      run: |
        pyinstaller main.spec 

    # NUEVO PASO: Renombrar el archivo generado
    - name: Rename executable for Release
      shell: bash
      run: |
        mv "dist/${{ matrix.original_file }}" "dist/BandaClasificadora-${{ github.ref_name }}-${{ matrix.os_suffix }}${{ matrix.ext }}"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}